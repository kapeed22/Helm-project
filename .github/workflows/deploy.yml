name: Build, Push GHCR & Deploy via Helm

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/frontend:latest

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy All Environments via Helm over SSM
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          COMMIT_SHA="${{ github.sha }}"
          REPO_URL="https://github.com/${{ github.repository }}.git"

          SCRIPT=$(cat << EOF | base64 -w 0
          set -e
          export PATH=\$PATH:/usr/local/bin:/usr/bin:/bin
          export KUBECONFIG=/home/ubuntu/.kube/config

          # Clone repo if not present or pull latest code
          if [ ! -d "/home/ubuntu/app/.git" ]; then
            echo "Cloning repository..."
            rm -rf /home/ubuntu/app
            git clone ${REPO_URL} /home/ubuntu/app
            cd /home/ubuntu/app
          else
            echo "Pulling latest code..."
            cd /home/ubuntu/app
            git pull origin main
          fi

          # Ensure Namespaces exist
          kubectl --kubeconfig=/home/ubuntu/.kube/config create namespace dev --dry-run=client -o yaml | kubectl --kubeconfig=/home/ubuntu/.kube/config apply -f -
          kubectl --kubeconfig=/home/ubuntu/.kube/config create namespace test --dry-run=client -o yaml | kubectl --kubeconfig=/home/ubuntu/.kube/config apply -f -
          kubectl --kubeconfig=/home/ubuntu/.kube/config create namespace prod --dry-run=client -o yaml | kubectl --kubeconfig=/home/ubuntu/.kube/config apply -f -

          # Create host storage paths
          sudo mkdir -p /mnt/data/dev /mnt/data/test /mnt/data/prod

          # Execute Helm Upgrades with explicit kubeconfig
          helm --kubeconfig=/home/ubuntu/.kube/config upgrade --install dev-release ./three-tier-app \
            -f ./three-tier-app/values-dev.yaml \
            --set image.repositoryOwner=${REPO_OWNER} \
            --set image.tag=${COMMIT_SHA}

          helm --kubeconfig=/home/ubuntu/.kube/config upgrade --install test-release ./three-tier-app \
            -f ./three-tier-app/values-test.yaml \
            --set image.repositoryOwner=${REPO_OWNER} \
            --set image.tag=${COMMIT_SHA}

          helm --kubeconfig=/home/ubuntu/.kube/config upgrade --install prod-release ./three-tier-app \
            -f ./three-tier-app/values-prod.yaml \
            --set image.repositoryOwner=${REPO_OWNER} \
            --set image.tag=${COMMIT_SHA}
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_MASTER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"su - ubuntu -c 'echo $SCRIPT | base64 -d | KUBECONFIG=/home/ubuntu/.kube/config bash'\"]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_MASTER_INSTANCE_ID }}" || true

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_MASTER_INSTANCE_ID }}" \
            --output json)

          echo "$OUTPUT" | jq -r '.StandardOutputContent'
          echo "$OUTPUT" | jq -r '.StandardErrorContent'

          STATUS=$(echo "$OUTPUT" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "SSM Execution Failed with status: $STATUS"
            exit 1
          fi

<!DOCTYPE html>
<html>
<head>
  <title>Multi-Env App</title>
  <style>
    body { font-family: sans-serif; display: grid; place-items: center; height: 100vh; background: #0f172a; color: #fff; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h1 { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="env-title">Loading Environment...</h1>
    <p id="redis-info">Connecting to services...</p>
  </div>
  <script>
    fetch('/api/info')
      .then(res => res.json())
      .then(data => {
        document.getElementById('env-title').innerText = data.message;
        document.getElementById('redis-info').innerText = `Total Redis Cache Hits: ${data.redisVisits}`;
      })
      .catch(() => {
        document.getElementById('env-title').innerText = "Failed to fetch from Backend API";
      });
  </script>
</body>
</html>
